name: Changelog

# Manual trigger only. Auto-trigger on push was failing because
# orhun/git-cliff-action@v4 auto-detects the repo from the cloned
# git remote and fetches GitHub PR metadata even when [remote.github]
# is removed from cliff.toml — the call hits anonymous rate limit (403).
# Re-enable the push trigger once a fix is in place (git-cliff version
# bump that disables auto-detect, or migration to a different action).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          # GITHUB_REPO intentionally unset — when present, orhun action
          # auto-configures [remote.github] in cliff.toml, which makes
          # git-cliff fetch PR metadata via the GitHub API and fail with
          # 403 (token isn't reliably forwarded). Without the env var,
          # the action skips the metadata fetch entirely.

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update changelog [skip ci]"
          git push
