[changelog]
header = """# Changelog

All notable changes to ModdersOmni.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
  ## Unreleased
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
  {% for commit in commits %}
    - {{ commit.message | split(pat="\n") | first | trim }}\
      {% if commit.github.username %} by @{{ commit.github.username }}{%- endif -%}
      {% if commit.github.pr_number %} in \
        [#{{ commit.github.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.github.pr_number }}) \
      {%- endif %}
  {%- endfor %}
{% endfor %}\n
"""
footer = """
---
*Generated by [git-cliff](https://git-cliff.org)*
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous" },
  { message = "^docs: update changelog", skip = true },
]
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "newest"

# [remote.github] intentionally omitted. With it set, git-cliff calls the
# GitHub API to enrich each commit with PR/username metadata; the call
# fails with 403 in CI because orhun/git-cliff-action@v4 does not reliably
# forward GITHUB_TOKEN to the underlying git-cliff binary. The template
# uses {% if commit.github.* %} guards, so absent metadata is harmless —
# usernames and PR numbers simply don't appear. Fresh-history rebuild
# doesn't need them anyway.
